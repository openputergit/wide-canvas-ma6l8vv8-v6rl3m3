<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Insurance Policy Tracker</title>
    <script src="https://unpkg.com/xlsx/dist/xlsx.full.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        .loader {
            border: 3px solid #f3f3f3;
            border-radius: 50%;
            border-top: 3px solid #3498db;
            width: 24px;
            height: 24px;
            animation: spin 1s linear infinite;
            display: none;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body class="bg-gray-50">
    <div class="min-h-screen">
        <!-- Header -->
        <header class="bg-blue-600 text-white p-4">
            <div class="container mx-auto">
                <h1 class="text-2xl font-bold">Insurance Policy Tracker</h1>
            </div>
        </header>

        <!-- Main Content -->
        <main class="container mx-auto p-4">
            <!-- Dashboard Summary -->
            <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-6">
                <div class="bg-white p-4 rounded-lg shadow">
                    <h3 class="font-semibold text-lg">Active Policies</h3>
                    <p class="text-3xl font-bold text-blue-600" id="activePoliciesCount">0</p>
                </div>
                <div class="bg-white p-4 rounded-lg shadow">
                    <h3 class="font-semibold text-lg">Upcoming Renewals</h3>
                    <p class="text-3xl font-bold text-yellow-600" id="upcomingRenewalsCount">0</p>
                </div>
                <div class="bg-white p-4 rounded-lg shadow">
                    <h3 class="font-semibold text-lg">Expired Policies</h3>
                    <p class="text-3xl font-bold text-red-600" id="expiredPoliciesCount">0</p>
                </div>
            </div>

            <!-- Add Policy Button -->
            <div class="mb-6">
                <button onclick="toggleModal()" class="bg-blue-600 text-white px-4 py-2 rounded-lg hover:bg-blue-700 transition">
                    <i class="bi bi-plus"></i> Add New Policy
                </button>
                <button onclick="exportToExcel()" class="bg-green-600 text-white px-4 py-2 rounded-lg hover:bg-green-700 transition ml-2">
                    <i class="bi bi-download"></i> Export to Excel
                </button>
            </div>

            <!-- Policies Table -->
            <div class="bg-white rounded-lg shadow overflow-x-auto">
                <table class="w-full">
                    <thead class="bg-gray-50">
                        <tr>
                            <th class="px-4 py-2 text-left">Insurance Type</th>
                            <th class="px-4 py-2 text-left">Provider</th>
                            <th class="px-4 py-2 text-left">Policy Number</th>
                            <th class="px-4 py-2 text-left">Premium</th>
                            <th class="px-4 py-2 text-left">Renewal Date</th>
                            <th class="px-4 py-2 text-left">Status</th>
                            <th class="px-4 py-2 text-left">Actions</th>
                        </tr>
                    </thead>
                    <tbody id="policiesTableBody"></tbody>
                </table>
            </div>
        </main>

        <!-- Add/Edit Policy Modal -->
        <div id="policyModal" class="fixed inset-0 bg-black bg-opacity-50 hidden flex items-center justify-center">
            <div class="bg-white rounded-lg p-6 w-full max-w-2xl">
                <h2 class="text-xl font-bold mb-4" id="modalTitle">Add New Policy</h2>
                <form id="policyForm" class="space-y-4">
                    <input type="hidden" id="policyId">
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <div>
                            <label class="block mb-1">Insurance Type</label>
                            <input type="text" id="insuranceType" class="w-full border rounded p-2" required>
                        </div>
                        <div>
                            <label class="block mb-1">Provider Name</label>
                            <input type="text" id="providerName" class="w-full border rounded p-2" required>
                        </div>
                        <div>
                            <label class="block mb-1">Policy Number</label>
                            <input type="text" id="policyNumber" class="w-full border rounded p-2" required>
                        </div>
                        <div>
                            <label class="block mb-1">Premium Amount</label>
                            <input type="number" id="premiumAmount" class="w-full border rounded p-2" required>
                        </div>
                        <div>
                            <label class="block mb-1">Start Date</label>
                            <input type="date" id="startDate" class="w-full border rounded p-2" required>
                        </div>
                        <div>
                            <label class="block mb-1">End Date</label>
                            <input type="date" id="endDate" class="w-full border rounded p-2" required>
                        </div>
                        <div>
                            <label class="block mb-1">Payment Frequency</label>
                            <select id="paymentFrequency" class="w-full border rounded p-2" required>
                                <option value="monthly">Monthly</option>
                                <option value="quarterly">Quarterly</option>
                                <option value="yearly">Yearly</option>
                            </select>
                        </div>
                        <div>
                            <label class="block mb-1">Email for Notifications</label>
                            <input type="email" id="notificationEmail" class="w-full border rounded p-2" required>
                        </div>
                    </div>
                    <div>
                        <label class="block mb-1">Notes</label>
                        <textarea id="notes" class="w-full border rounded p-2" rows="3"></textarea>
                    </div>
                    <div class="flex justify-end gap-2">
                        <button type="button" onclick="toggleModal()" class="bg-gray-500 text-white px-4 py-2 rounded hover:bg-gray-600">
                            Cancel
                        </button>
                        <button type="submit" class="bg-blue-600 text-white px-4 py-2 rounded hover:bg-blue-700">
                            Save Policy
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script>
        let policies = [];
        const appSlug = 'insurance-tracker-123456';

        // Initialize
        document.addEventListener('DOMContentLoaded', () => {
            loadPolicies();
            document.getElementById('policyForm').addEventListener('submit', handleSubmit);
        });

        function toggleModal(policy = null) {
            const modal = document.getElementById('policyModal');
            const modalTitle = document.getElementById('modalTitle');
            const form = document.getElementById('policyForm');

            if (modal.classList.contains('hidden')) {
                modal.classList.remove('hidden');
                if (policy) {
                    modalTitle.textContent = 'Edit Policy';
                    fillFormWithPolicy(policy);
                } else {
                    modalTitle.textContent = 'Add New Policy';
                    form.reset();
                }
            } else {
                modal.classList.add('hidden');
            }
        }

        function fillFormWithPolicy(policy) {
            document.getElementById('policyId').value = policy._id;
            document.getElementById('insuranceType').value = policy.insuranceType;
            document.getElementById('providerName').value = policy.providerName;
            document.getElementById('policyNumber').value = policy.policyNumber;
            document.getElementById('premiumAmount').value = policy.premiumAmount;
            document.getElementById('startDate').value = policy.startDate;
            document.getElementById('endDate').value = policy.endDate;
            document.getElementById('paymentFrequency').value = policy.paymentFrequency;
            document.getElementById('notificationEmail').value = policy.notificationEmail;
            document.getElementById('notes').value = policy.notes || '';
        }

        async function handleSubmit(e) {
            e.preventDefault();
            const formData = {
                insuranceType: document.getElementById('insuranceType').value,
                providerName: document.getElementById('providerName').value,
                policyNumber: document.getElementById('policyNumber').value,
                premiumAmount: document.getElementById('premiumAmount').value,
                startDate: document.getElementById('startDate').value,
                endDate: document.getElementById('endDate').value,
                paymentFrequency: document.getElementById('paymentFrequency').value,
                notificationEmail: document.getElementById('notificationEmail').value,
                notes: document.getElementById('notes').value
            };

            const policyId = document.getElementById('policyId').value;
            
            try {
                const response = await fetch('https://r0c8kgwocscg8gsokogwwsw4.zetaverse.one/mongodb', {
                    method: 'POST',
                    headers: {
                        'Authorization': 'Bearer cU3Bpb1ZjoVRFUrn9lCXbEM8cHm1',
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        appSlug,
                        action: policyId ? 'update' : 'create',
                        collection: 'policies',
                        id: policyId || undefined,
                        data: formData
                    })
                });

                if (response.ok) {
                    toggleModal();
                    loadPolicies();
                }
            } catch (error) {
                console.error('Error saving policy:', error);
            }
        }

        async function loadPolicies() {
            try {
                const response = await fetch('https://r0c8kgwocscg8gsokogwwsw4.zetaverse.one/mongodb', {
                    method: 'POST',
                    headers: {
                        'Authorization': 'Bearer cU3Bpb1ZjoVRFUrn9lCXbEM8cHm1',
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        appSlug,
                        action: 'read',
                        collection: 'policies'
                    })
                });

                if (response.ok) {
                    const data = await response.json();
                    policies = data.result;
                    updateDashboard();
                    renderPoliciesTable();
                }
            } catch (error) {
                console.error('Error loading policies:', error);
            }
        }

        function updateDashboard() {
            const now = new Date();
            const active = policies.filter(p => new Date(p.endDate) >= now);
            const upcoming = policies.filter(p => {
                const renewalDate = new Date(p.endDate);
                const daysDiff = (renewalDate - now) / (1000 * 60 * 60 * 24);
                return daysDiff >= 0 && daysDiff <= 30;
            });
            const expired = policies.filter(p => new Date(p.endDate) < now);

            document.getElementById('activePoliciesCount').textContent = active.length;
            document.getElementById('upcomingRenewalsCount').textContent = upcoming.length;
            document.getElementById('expiredPoliciesCount').textContent = expired.length;
        }

        function renderPoliciesTable() {
            const tbody = document.getElementById('policiesTableBody');
            tbody.innerHTML = '';

            policies.forEach(policy => {
                const tr = document.createElement('tr');
                const now = new Date();
                const endDate = new Date(policy.endDate);
                const status = endDate < now ? 'Expired' : 'Active';
                const statusClass = status === 'Expired' ? 'text-red-600' : 'text-green-600';

                tr.innerHTML = `
                    <td class="px-4 py-2">${policy.insuranceType}</td>
                    <td class="px-4 py-2">${policy.providerName}</td>
                    <td class="px-4 py-2">${policy.policyNumber}</td>
                    <td class="px-4 py-2">$${policy.premiumAmount}</td>
                    <td class="px-4 py-2">${new Date(policy.endDate).toLocaleDateString()}</td>
                    <td class="px-4 py-2 ${statusClass} font-semibold">${status}</td>
                    <td class="px-4 py-2">
                        <button onclick="toggleModal(${JSON.stringify(policy)})" class="text-blue-600 hover:text-blue-800">
                            <i class="bi bi-pencil"></i>
                        </button>
                        <button onclick="deletePolicy('${policy._id}')" class="text-red-600 hover:text-red-800 ml-2">
                            <i class="bi bi-trash"></i>
                        </button>
                    </td>
                `;
                tbody.appendChild(tr);
            });
        }

        async function deletePolicy(id) {
            if (!confirm('Are you sure you want to delete this policy?')) return;

            try {
                const response = await fetch('https://r0c8kgwocscg8gsokogwwsw4.zetaverse.one/mongodb', {
                    method: 'POST',
                    headers: {
                        'Authorization': 'Bearer cU3Bpb1ZjoVRFUrn9lCXbEM8cHm1',
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        appSlug,
                        action: 'delete',
                        collection: 'policies',
                        id
                    })
                });

                if (response.ok) {
                    loadPolicies();
                }
            } catch (error) {
                console.error('Error deleting policy:', error);
            }
        }

        function exportToExcel() {
            const worksheet = XLSX.utils.json_to_sheet(policies);
            const workbook = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(workbook, worksheet, "Policies");
            XLSX.writeFile(workbook, "insurance_policies.xlsx");
        }
    </script>
<script>document.body.addEventListener('wheel', e => { if (!e.ctrlKey) return; e.preventDefault(); return }, { passive: false })</script>
	</body>
</html>
